# dsh-provider-signin bundle patch: mounts the authorization seam (shipped
# web does not) and this plugin's host+browser halves. The authorization row
# must exist: this plugin injects `authorization`, and llm-pi-ai only
# registers its login flows when that service is present. The provider-signin
# row mounts BOTH halves: host relay routes under /api/provider-signin and
# the browser provider-card seats, served from this package's lib/client.js.
- insert:
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: provider-signin
      name: dsh-provider-signin
